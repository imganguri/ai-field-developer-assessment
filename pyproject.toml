[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-field-developer-assessment"
version = "1.0.0"
description = "Four runnable AI field developer engineering exercises"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "pydantic==2.14.2",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["task*", "mocks*"]
